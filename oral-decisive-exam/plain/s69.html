<p class="meta">Ch.E-6 · 歷年 E 組</p>
<blockquote>
<p>這四位在 111 年都是第一次擔任口試委員、完全沒有考古題。準備方式只有一條路：⭐ 從他們的次專長與代表性研究反推。〔總索引的警語〕「2025 年 15 站中有 11 位在歷史檔案裡是首見——這代表『背固定題』的策略單獨用不夠，考官檔案裡的『次專長』比『歷史題目』更能預測今年。」</p>
